ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    AllowOverride All
    Options -Indexes
</Directory>

<DirectoryMatch "^/var/www/html/(database|cache|includes|lang|docker)(/|$)">
    Require all denied
</DirectoryMatch>

<Directory /var/www/html/uploads>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
</Directory>
