# Safety net that does not depend on .htaccess files (a mounted volume can hide them).
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    AllowOverride All
    Options -Indexes
</Directory>

# Private folders: never reachable from the web
<DirectoryMatch "^/var/www/html/(database|cache|includes|lang|docker)(/|$)">
    Require all denied
</DirectoryMatch>

# Uploads: no scripts
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
</Directory>
